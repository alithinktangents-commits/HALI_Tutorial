      - name: Build the app
        working-directory: RPTutor
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RPTutor.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RP Tutor app (build ${{ github.run_number }})
          body: Open this page on your Android phone and tap RPTutor.apk to download and install.
          files: RPTutor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RPTutor-apk
          path: RPTutor.apk
